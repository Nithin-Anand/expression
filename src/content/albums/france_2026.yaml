title: France
description: A trip to France in July 2026
cover: NITH1405_rjosup
date: 2026-07-25
essay: |
  A trip to Nice and Paris with friends. We spent a couple of days in Nice, then took a 6 hour train up to Paris. It was a lot of fun,
  although the weather not so much. It peaked at 37°C with many places not having A/C, unfortunately my train carriage included. Photography-wise,
  I'm glad I managed to visit the Cartier-Bresson Foundation. However, ultimately this trip was more about quality time with friends rather
  than photography.
